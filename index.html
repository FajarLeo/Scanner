<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Application Quality Scanner</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

<nav class="navbar navbar-dark bg-primary shadow-sm">
    <div class="container">
        <span class="navbar-brand fw-bold">
            <i class="bi bi-shield-check"></i>
            Smart Application Quality Scanner
        </span>
    </div>
</nav>

<div class="container py-5">

    <!-- Input -->
    <div class="card shadow border-0 mb-4">

        <div class="card-body p-4">

            <h3 class="fw-bold mb-3">
                Scan Website
            </h3>

            <p class="text-muted">
                Enter your website URL below.
            </p>

            <input
                id="url"
                type="text"
                class="form-control form-control-lg"
                placeholder="https://example.com">

            <button
                id="scanBtn"
                class="btn btn-primary btn-lg w-100 mt-4">

                <i class="bi bi-search"></i>

                Scan Application

            </button>

        </div>

    </div>

    <!-- Loading -->

    <div
        id="loadingCard"
        class="card shadow border-0 mb-4 d-none">

        <div class="card-body text-center">

            <h4>Scanning...</h4>

            <div class="progress mt-4">

                <div
                    id="progressBar"
                    class="progress-bar progress-bar-striped progress-bar-animated"
                    style="width:0%">

                </div>

            </div>

            <p
                id="loadingText"
                class="mt-3 text-muted">

                Initializing...

            </p>

        </div>

    </div>

    <!-- Result -->

    <div
        id="resultCard"
        class="card shadow border-0 d-none">

        <div class="card-body">

            <h3 class="fw-bold mb-4">

                Scan Result

            </h3>

            <div class="row text-center">

                <div class="col-md-4 mb-3">

                    <h6>Performance</h6>

                    <h2 id="performance">0</h2>

                </div>

                <div class="col-md-4 mb-3">

                    <h6>Accessibility</h6>

                    <h2 id="accessibility">0</h2>

                </div>

                <div class="col-md-4 mb-3">

                    <h6>Security</h6>

                    <h2 id="security">0</h2>

                </div>

            </div>

            <hr>

            <div class="text-center">

                <h5>Overall Score</h5>

                <h1
                    id="overall"
                    class="display-3 text-primary fw-bold">

                    0

                </h1>

                <span
                    id="category"
                    class="badge bg-success fs-6">

                    -

                </span>

            </div>

            <hr>

            <h5 class="mb-3">

                Recommendation

            </h5>

            <ul id="recommendation">

                <li>Waiting...</li>

            </ul>

        </div>

    </div>

</div>

<script src="script.js"></script>

</body>
</html>
